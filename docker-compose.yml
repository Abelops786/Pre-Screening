version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: recruitment_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recruiter_secret}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-recruiter}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recruitment_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruiter}:${POSTGRES_PASSWORD:-recruiter_secret}@postgres:5432/${POSTGRES_DB:-recruitment}
      NODE_ENV: production
    env_file:
      - ./backend/.env
    ports:
      - '4000:4000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && node src/app.js"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recruitment_frontend
    depends_on:
      - backend
    env_file:
      - ./frontend/.env
    ports:
      - '3000:3000'

volumes:
  postgres_data:
